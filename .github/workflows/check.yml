name: Check skills

on:
  # Every pull request, not only ones touching skills: `check` is required to merge, so a
  # change to the docs alone could never be merged while it didn't run.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate every skill with Peanut Butter's own validator
        run: java -jar tools/pbskill.jar check skills/*.pbskill
