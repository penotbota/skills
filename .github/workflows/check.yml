name: Check skills

on:
  pull_request:
    paths: ["skills/**", "tools/**", ".github/workflows/**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate every skill with Peanut Butter's own validator
        run: java -jar tools/pbskill.jar check skills/*.pbskill
