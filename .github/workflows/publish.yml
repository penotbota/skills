name: Publish skills.penotbota.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the index, checksums and browse page
        # Refuses to publish if any skill fails the check.
        run: java -jar tools/pbskill.jar index skills site https://skills.penotbota.com "https://github.com/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://skills.penotbota.com
    steps:
      - uses: actions/deploy-pages@v4
